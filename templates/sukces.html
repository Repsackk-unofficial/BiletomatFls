<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sukces - Automat Biletowy</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>
<body class="bg-light">

    <div class="container py-5" style="max-width: 600px;">
        <div class="card shadow border-0 p-5 text-center">
            <div class="mb-3">
                <i class="bi bi-check-circle-fill text-success" style="font-size: 4rem;"></i>
            </div>
            <h1 class="fw-bold text-success mb-2">Dziękujemy za zakup!</h1>
            <p class="text-muted">Twoje bilety zostały pomyślnie opłacone i wydrukowane.</p>
            
            <div class="alert alert-success my-3 fs-5">
                <strong>Wydana reszta: {{ "%.2f"|format(reszta) }} PLN</strong>
            </div>

            <div class="text-start mt-4">
                <h5 class="fw-bold mb-3 border-bottom pb-2">Zakupione bilety:</h5>
                <ul class="list-group mb-4">
                    {% for b in zakupione %}
                        <li class="list-group-item d-flex justify-content-between align-items-center">
                            <span>{{ b.nazwa }}</span>
                            <span class="badge bg-secondary">{{ "%.2f"|format(b.cena) }} PLN</span>
                        </li>
                    {% endfor %}
                </ul>
            </div>

            <a href="{{ url_for('index') }}" class="btn btn-primary btn-lg w-100">
                <i class="bi bi-arrow-repeat"></i> Kup kolejne bilety
            </a>
        </div>
    </div>

</body>
</html>
